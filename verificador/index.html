<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preview · Verificador de Precios 1280×800</title>
<style>
:root{--red:#d90416;--green:#28b528;--ink:#081529;--muted:#6e7c92;--line:#e7edf5}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#0d1117;overflow:hidden;color:var(--ink)}body{display:grid;place-items:center}
.stage{width:1280px;height:800px;position:relative;transform-origin:center center;background:radial-gradient(circle at 18% 20%,rgba(112,182,230,.16),transparent 28%),radial-gradient(circle at 84% 18%,rgba(210,222,240,.24),transparent 31%),linear-gradient(180deg,#fbfdff,#f4f7fb)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 6%,rgba(255,255,255,.65) 14% 20%,transparent 30% 72%,rgba(255,255,255,.55) 82% 88%,transparent 96%);filter:blur(18px);opacity:.8}
.logo{position:absolute;right:24px;top:22px;width:88px;z-index:3}
.prompt{position:relative;z-index:2;height:158px;display:flex;align-items:flex-end;justify-content:center;gap:24px;padding-bottom:20px;font-size:31px;font-weight:800;letter-spacing:-.7px}
.scan{width:70px;height:55px;position:relative}.scan:before{content:"";position:absolute;inset:0;background:linear-gradient(#66748a,#66748a) left top/23px 4px no-repeat,linear-gradient(#66748a,#66748a) left top/4px 20px no-repeat,linear-gradient(#66748a,#66748a) right top/23px 4px no-repeat,linear-gradient(#66748a,#66748a) right top/4px 20px no-repeat,linear-gradient(#66748a,#66748a) left bottom/23px 4px no-repeat,linear-gradient(#66748a,#66748a) left bottom/4px 20px no-repeat,linear-gradient(#66748a,#66748a) right bottom/23px 4px no-repeat,linear-gradient(#66748a,#66748a) right bottom/4px 20px no-repeat}.scan:after{content:"";position:absolute;left:19px;top:13px;width:32px;height:29px;background:repeating-linear-gradient(90deg,#66748a 0 3px,transparent 3px 6px,#66748a 6px 8px,transparent 8px 11px)}
.card{position:relative;z-index:2;width:1180px;height:555px;margin:auto;background:rgba(255,255,255,.98);border:1px solid rgba(218,228,239,.95);border-radius:30px;box-shadow:0 18px 55px rgba(43,72,105,.15);display:grid;grid-template-columns:56% 44%;overflow:hidden}
.left{position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 48% 48%,rgba(187,228,255,.46),transparent 67%)}.left:after{content:"";position:absolute;right:0;top:42px;bottom:42px;width:1px;background:#e3e9f1}.product{width:93%;height:88%;object-fit:contain}.badge{position:absolute;z-index:4;left:96px;top:42px;min-width:186px;height:78px;padding:0 28px;border-radius:20px;background:linear-gradient(180deg,#4ddd39,#25b820 55%,#149b17);border:4px solid #fff;box-shadow:0 12px 20px rgba(22,149,28,.28),inset 0 2px 0 rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:35px;font-weight:950;letter-spacing:-1px;transform:rotate(-7deg);text-shadow:0 2px 2px rgba(0,0,0,.13)}.badge:before,.badge:after{content:"";position:absolute;width:10px;height:31px;border-radius:8px;background:#64df4c;top:-36px;left:55px;transform:rotate(-17deg);box-shadow:31px 15px 0 #64df4c}
.right{display:flex;flex-direction:column;justify-content:center;padding:54px 46px 38px 42px}.name{margin:0 0 12px;font-size:55px;line-height:.98;font-weight:950;letter-spacing:-2px}.desc{margin:0 0 22px;font-size:27px;font-weight:600;color:var(--muted)}.regular{display:none;margin:-3px 0 4px;font-size:21px;color:#778397;font-weight:700}.regular strong{text-decoration:line-through}.price{display:flex;align-items:flex-end;height:170px;color:var(--red);white-space:nowrap;margin:3px 0 20px;line-height:.78}.currency{font-size:58px;font-weight:900;margin-right:19px;padding-bottom:27px;letter-spacing:-2px}.whole{font-size:171px;font-weight:950;letter-spacing:-8px}.cents{font-size:112px;font-weight:950;letter-spacing:-5px;padding-bottom:5px;margin-left:4px}.meta{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:16px;color:#6d7b91;font-size:18px;font-weight:600}.barcode{width:72px;height:42px;background:repeating-linear-gradient(90deg,#071426 0 2px,transparent 2px 4px,#071426 4px 7px,transparent 7px 10px,#071426 10px 12px,transparent 12px 16px)}.meta b{font-size:20px;color:#111a2a}.secondary{display:none;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 0 12px}.pricebox{border:1px solid #e0e6ee;border-radius:13px;background:#f8fafc;padding:11px}.pricebox small{display:block;color:#768399;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}.pricebox strong{font-size:20px;color:#182132}
.mode-offer .badge{background:linear-gradient(180deg,#ff4b4b,#e91821 58%,#c90812);box-shadow:0 12px 20px rgba(194,8,18,.27),inset 0 2px 0 rgba(255,255,255,.32)}.mode-offer .badge:before,.mode-offer .badge:after{background:#ff5353;box-shadow:31px 15px 0 #ff5353}.mode-offer .regular{display:block}.mode-offer .price{height:150px}.mode-offer .whole{font-size:150px}.mode-offer .cents{font-size:100px}.mode-offer .currency{font-size:52px}
.mode-normal .badge,.mode-nophoto .badge{display:none}.mode-multi .secondary{display:grid}.mode-multi .price{height:124px;margin-bottom:8px}.mode-multi .whole{font-size:128px}.mode-multi .cents{font-size:85px}.mode-multi .currency{font-size:48px;padding-bottom:18px}.mode-nophoto.card{width:930px;grid-template-columns:1fr}.mode-nophoto .left{display:none}.mode-nophoto .right{text-align:center;align-items:center;padding:55px 78px 40px}.mode-nophoto .name{font-size:62px;max-width:760px}.mode-nophoto .meta{width:100%;justify-content:center}
.controls{position:fixed;z-index:50;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:7px;padding:8px;background:rgba(14,17,23,.94);border:1px solid rgba(255,255,255,.12);border-radius:15px;box-shadow:0 14px 42px rgba(0,0,0,.34);backdrop-filter:blur(10px)}.controls button{border:0;background:#313641;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800;font-size:13px;cursor:pointer}.controls button.active{background:#fff;color:#111827}.rotate{display:none;position:fixed;z-index:80;left:50%;top:10px;transform:translateX(-50%);background:#fff;color:#111;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.25)}@media(orientation:portrait){.rotate{display:block}}
</style>
</head>
<body>
<div class="rotate">↻ Gira el teléfono para ver el formato horizontal real</div>
<div class="stage" id="stage">
  <img id="logo" class="logo" alt="138">
  <div class="prompt"><span class="scan"></span><span>Escanee un producto para consultar su precio</span></div>
  <main class="card mode-new" id="screen">
    <section class="left"><img class="product" src="assets/producto-demo.svg" alt="Producto demo"><div class="badge" id="badge">NUEVO</div></section>
    <section class="right">
      <h1 class="name">Galletas de<br>Chocolate Familiar</h1>
      <p class="desc">Presentación 500 g</p>
      <div class="regular">Precio regular <strong>B/. 4.49</strong></div>
      <div class="price"><span class="currency">B/.</span><span class="whole">3</span><span class="cents">.49</span></div>
      <div class="secondary"><div class="pricebox"><small>6 unidades</small><strong>B/. 19.20</strong></div><div class="pricebox"><small>12 unidades</small><strong>B/. 36.00</strong></div><div class="pricebox"><small>Caja</small><strong>B/. 68.40</strong></div></div>
      <div class="meta"><span class="barcode"></span><span>Código de barras : <b>7451001234567</b></span></div>
    </section>
  </main>
</div>
<nav class="controls"><button class="active" data-mode="new">Nuevo</button><button data-mode="offer">Oferta</button><button data-mode="normal">Normal</button><button data-mode="multi">Varios precios</button><button data-mode="nophoto">Sin foto</button></nav>
<script>
const stage=document.getElementById('stage'),screen=document.getElementById('screen'),badge=document.getElementById('badge'),logo=document.getElementById('logo'),buttons=[...document.querySelectorAll('.controls button')];
fetch('assets/logo.b64').then(r=>r.text()).then(t=>logo.src='data:image/png;base64,'+t.trim());
function fit(){const reserve=58;stage.style.transform=`scale(${Math.min(innerWidth/1280,(innerHeight-reserve)/800,1)})`}
function mode(m){screen.className='card mode-'+m;badge.textContent=m==='offer'?'OFERTA':'NUEVO';buttons.forEach(b=>b.classList.toggle('active',b.dataset.mode===m))}
buttons.forEach(b=>b.onclick=()=>mode(b.dataset.mode));addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,100));fit();mode('new');
</script>
</body>
</html>
